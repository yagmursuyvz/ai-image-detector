[tool.poetry]
name = "ai-image-detector"
version = "0.1.0"
description = "AI-generated vs real image classifier with an MLOps pipeline"
authors = ["Yagmursu Yavuz-Tugbanur Turkmen <mail@ornek.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,!=3.14.1,<3.15"
mlflow = "2.13.0"
gunicorn = "<23"
fastapi = "^0.143.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
pydantic = "^2.14.1"
python-multipart = "^0.0.32"
prometheus-client = "^0.26.0"
setuptools = "<81"
wheel = "^0.48.0"
great-expectations = "<1.0"
torch = "^2.14.1"
torchvision = "^0.29.1"
boto3 = "^1.43.114"
optuna = "^5.0.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
